# Additional OpenWrt feeds for the V50 build.
#
# These feeds extend OpenWrt's standard feeds.conf.default with third-party
# packages referenced by config/default.config. They are appended to the
# upstream feeds during build, never replacing them.
#
# Format: src-git <name> <url>[@<commit>]
# ^HEAD tracks the latest commit (changes on each fetch).

# PassWall2 (proxy client + LuCI app + helpers)
# Upstream: https://github.com/xiaorouji/openwrt-passwall
src-git passwall2 https://github.com/xiaorouji/openwrt-passwall.git^HEAD

# LuCI Aurora theme
# Upstream: https://github.com/eamonxg/luci-theme-aurora
src-git theme_aurora https://github.com/eamonxg/luci-theme-aurora.git^HEAD